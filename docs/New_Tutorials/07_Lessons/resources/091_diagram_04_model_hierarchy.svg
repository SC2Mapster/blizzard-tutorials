<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="hierArr" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#0f172a" rx="8"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">SC2 Data Hierarchy: How Missile Visuals Are Configured</text>

  <!-- LEFT COLUMN: CModel Chain -->
  <text x="200" y="65" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">CModel Hierarchy</text>
  <text x="200" y="80" text-anchor="middle" fill="#475569" font-size="9">ModelData.xml</text>

  <!-- CModel (default) -->
  <rect x="110" y="95" width="180" height="42" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="113" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">CModel (default)</text>
  <text x="200" y="128" text-anchor="middle" fill="#64748b" font-size="9">Base model type</text>

  <line x1="200" y1="137" x2="200" y2="152" stroke="#475569" stroke-width="1" marker-end="url(#hierArr)"/>

  <!-- FX -->
  <rect x="110" y="155" width="180" height="50" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="200" y="174" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">FX</text>
  <text x="200" y="190" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">Wait="0"</text>
  <text x="200" y="200" text-anchor="middle" fill="#475569" font-size="7">line 118</text>

  <line x1="200" y1="205" x2="200" y2="220" stroke="#475569" stroke-width="1" marker-end="url(#hierArr)"/>

  <!-- MissileFX -->
  <rect x="110" y="223" width="180" height="50" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="242" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">MissileFX</text>
  <text x="200" y="258" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">Priority="16"</text>
  <text x="200" y="268" text-anchor="middle" fill="#475569" font-size="7">line 130</text>

  <line x1="200" y1="273" x2="200" y2="288" stroke="#475569" stroke-width="1" marker-end="url(#hierArr)"/>

  <!-- HornerAirFleetMissileAttackMissile (Model) -->
  <rect x="68" y="291" width="264" height="56" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="200" y="310" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">HornerAirFleetMissileAttackMissile</text>
  <text x="200" y="325" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">MiraHorner_FleetCalldown_Missile.m3</text>
  <text x="200" y="340" text-anchor="middle" fill="#475569" font-size="7">starcoop ModelData.xml:37554</text>

  <!-- Note: no RadiusLoose -->
  <rect x="75" y="355" width="250" height="28" rx="4" fill="#7f1d1d" opacity="0.3" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="200" y="374" text-anchor="middle" fill="#ef4444" font-size="9">No RadiusLoose override — uses .m3 BNDS only</text>

  <!-- Contrast: WizSimpleBeam -->
  <rect x="75" y="395" width="250" height="48" rx="4" fill="#14532d" opacity="0.2" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="200" y="413" text-anchor="middle" fill="#22c55e" font-size="9">Compare: WizSimpleBeam</text>
  <text x="200" y="428" text-anchor="middle" fill="#22c55e" font-size="8" font-family="monospace">RadiusLoose="1.000000"</text>
  <text x="200" y="438" text-anchor="middle" fill="#475569" font-size="7">line 170</text>

  <!-- MIDDLE COLUMN: Actor Chain -->
  <text x="530" y="65" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600">CActorMissile Hierarchy</text>
  <text x="530" y="80" text-anchor="middle" fill="#475569" font-size="9">ActorData.xml</text>

  <!-- CActorModel (default) -->
  <rect x="430" y="95" width="200" height="50" rx="5" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="530" y="113" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">CActorModel (default)</text>
  <text x="530" y="128" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">AllowHitTest="1"</text>
  <text x="530" y="139" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">UpdateVisibility="1"</text>

  <line x1="530" y1="145" x2="530" y2="160" stroke="#475569" stroke-width="1" marker-end="url(#hierArr)"/>

  <!-- GenericAttackMissile -->
  <rect x="420" y="163" width="220" height="86" rx="5" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="530" y="181" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">GenericAttackMissile</text>
  <text x="530" y="196" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">Aliases: _Unit, _Missile</text>
  <text x="530" y="208" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">PreHost: _ActorAction</text>
  <text x="530" y="220" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">On: UnitBirth → Create</text>
  <text x="530" y="232" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">On: UnitDeath → Destroy</text>
  <text x="530" y="244" text-anchor="middle" fill="#475569" font-size="7">core ActorData.xml:1297</text>

  <line x1="530" y1="249" x2="530" y2="264" stroke="#475569" stroke-width="1" marker-end="url(#hierArr)"/>

  <!-- HornerAirFleetMissileAttackMissile (Actor) -->
  <rect x="398" y="267" width="264" height="56" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="530" y="286" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">HornerAirFleetMissileAttackMissile</text>
  <text x="530" y="301" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">unitName: HornerAirFleetMissileWeapon</text>
  <text x="530" y="316" text-anchor="middle" fill="#475569" font-size="7">starcoop ActorData.xml:45545</text>

  <!-- RIGHT COLUMN: Unit + Mover -->
  <text x="780" y="65" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="600">Unit + Mover</text>

  <!-- Unit -->
  <rect x="700" y="95" width="170" height="56" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
  <text x="785" y="113" text-anchor="middle" fill="#fdba74" font-size="10" font-weight="600">HornerAirFleetMissileWeapon</text>
  <text x="785" y="128" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">parent: MISSILE_INVULNERABLE</text>
  <text x="785" y="143" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">Mover: MissileDefault</text>

  <line x1="785" y1="151" x2="785" y2="166" stroke="#475569" stroke-width="1" marker-end="url(#hierArr)"/>

  <!-- Mover -->
  <rect x="700" y="170" width="170" height="70" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
  <text x="785" y="188" text-anchor="middle" fill="#fdba74" font-size="10" font-weight="600">MissileDefault</text>
  <text x="785" y="206" text-anchor="middle" fill="#22c55e" font-size="9" font-weight="600" font-family="monospace">MaxSpeed="18.75"</text>
  <text x="785" y="218" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">Accel="3200"</text>
  <text x="785" y="232" text-anchor="middle" fill="#475569" font-size="7">core MoverData.xml:13</text>

  <!-- Speed vs Threshold comparison -->
  <rect x="695" y="255" width="180" height="48" rx="4" fill="#14532d" opacity="0.3" stroke="#22c55e" stroke-width="1"/>
  <text x="785" y="275" text-anchor="middle" fill="#22c55e" font-size="9" font-weight="500">18.75 > 5.0 threshold</text>
  <text x="785" y="292" text-anchor="middle" fill="#86efac" font-size="8">Bounds extension IS active</text>

  <!-- Connecting arrows between columns -->
  <path d="M332,315 L398,290" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#hierArr)"/>
  <text x="365" y="296" fill="#475569" font-size="7">references</text>

  <path d="M630,295 L700,140" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#hierArr)"/>

  <!-- BOTTOM: GlobalConfig -->
  <rect x="280" y="400" width="340" height="100" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="420" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">CActorGlobalConfig (SYSTEM_ActorConfig)</text>
  <line x1="295" y1="428" x2="605" y2="428" stroke="#334155" stroke-width="1"/>
  <text x="310" y="448" fill="#fbbf24" font-size="9" font-family="monospace">MissileBoundsOptSpeedThreshold</text>
  <text x="310" y="464" fill="#64748b" font-size="9" font-family="monospace">value="5.000000"</text>
  <text x="310" y="483" fill="#94a3b8" font-size="8">Extends BNDS to include particles</text>
  <text x="310" y="495" fill="#94a3b8" font-size="8">for missiles faster than this speed</text>

  <!-- Arrow from GlobalConfig to Mover speed -->
  <path d="M620,445 L700,290" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#hierArr)"/>
  <text x="670" y="370" fill="#f59e0b" font-size="7" transform="rotate(-65,670,370)">compares to MaxSpeed</text>
</svg>
